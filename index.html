<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WnelAI Status — Otomatik Health Check</title>
    <meta name="description" content="WnelAI servisleri için 7/24 otomatik health check, performans ve kesinti izleme sistemi." />
    <meta property="og:title" content="WnelAI Status — Otomatik Health Check" />
    <meta property="og:description" content="WnelAI servisleri için 7/24 otomatik health check, performans ve kesinti izleme sistemi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('wnel_theme') || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
